name: Check Template Status

on:
  workflow_dispatch:
    inputs:
      extra:
        description: 'Query params extra, ej. plantilla=hello_world&idioma=en_US (para probar sin depender de recordatorio_clases)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probar envio real
        run: |
          RESPUESTA=$(curl -s "https://whatsapp-sender.lsotoangeldonis.workers.dev/test?token=${{ secrets.TEST_TOKEN }}&fecha=2026-09-22&${{ github.event.inputs.extra }}")
          echo "$RESPUESTA"
          if echo "$RESPUESTA" | jq -e '.enviado == true' > /dev/null 2>&1; then
            echo "### ✅ Plantilla aprobada — mensaje real enviado" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏳ Plantilla todavía en revisión" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPUESTA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
