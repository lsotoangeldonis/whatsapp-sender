name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            WHATSAPP_TOKEN
            PHONE_NUMBER_ID
            DESTINATARIO
            TEST_TOKEN
            WHATSAPP_TEMPLATE_NAME
            WHATSAPP_TEMPLATE_LANG
            ANTHROPIC_API_KEY
            CAMPUS_USUARIO
            CAMPUS_PASSWORD
            WEBHOOK_VERIFY_TOKEN
            CAMPUS_PER_CODIGO
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          DESTINATARIO: ${{ secrets.DESTINATARIO }}
          TEST_TOKEN: ${{ secrets.TEST_TOKEN }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAMPUS_USUARIO: ${{ secrets.CAMPUS_USUARIO }}
          CAMPUS_PASSWORD: ${{ secrets.CAMPUS_PASSWORD }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          CAMPUS_PER_CODIGO: ${{ secrets.CAMPUS_PER_CODIGO }}
